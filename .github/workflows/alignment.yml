name: alignment

on:
  workflow_dispatch:
#  schedule:
#    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: alignment
  cancel-in-progress: false

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-alignment-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-alignment-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Ensure required directories exist
        run: |
          mkdir -p inputs
          mkdir -p work

      - name: Debug python import paths
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          pwd
          echo "---- src tree ----"
          find src -maxdepth 4 -type f | sort || true
          echo "---- sys.path ----"
          python -c "import sys; print('\n'.join(sys.path))"
          echo "---- import voicecaster ----"
          python -c "import voicecaster; print(voicecaster.__file__)"

      - name: Run alignment
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m voicecaster.alignment.run

      - name: Show worktree status
        if: always()
        run: |
          git status --short
          echo "----"
          find work -maxdepth 4 -type f | sort || true

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add inputs/inputs.json work/

          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi

          git commit -m "alignment: update episode artifacts"
          git push
