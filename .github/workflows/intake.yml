# .github/workflows/intake.yml
name: intake

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/intake.yml"
      - "requirements.txt"
      - "inputs/inputs.json"
      - "src/voicecaster/intake/**"

concurrency:
  group: voicecaster-intake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intake
        env:
          PYTHONPATH: src
        run: |
          python -m voicecaster.intake.runner

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add inputs/inputs.json work/
            git commit -m "chore(intake): update intake state"
            git push
          fi
