# .github/workflows/intake.yml
name: intake

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/intake.yml"
      - "inputs/inputs.json"
      - "src/voicecaster/intake/**"
  schedule:
    - cron: "*/59 * * * *"   # 🔴 cada 15 minutos

concurrency:
  group: voicecaster-intake
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  # 🔹 PRECHECK
  precheck:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - uses: actions/checkout@v4

      - name: Check if intake work exists
        id: check
        run: |
          python - << 'EOF'
          import json

          with open("inputs/inputs.json") as f:
              data = json.load(f)

          should_run = any(e.get("status") == "intake" for e in data)

          print(f"should_run={str(should_run).lower()}")

          with open("result.txt", "w") as f:
              f.write(str(should_run).lower())
          EOF

          echo "should_run=$(cat result.txt)" >> $GITHUB_OUTPUT


  # 🔹 INTAKE
  intake:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intake
        env:
          PYTHONPATH: src
        run: |
          python -m voicecaster.intake.runner

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add inputs/inputs.json work/
            git commit -m "chore(intake): update intake state"
            git push
          fi
