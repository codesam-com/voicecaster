name: diarization

on:
  workflow_dispatch:
#  schedule:
#    - cron: "17 * * * *"
  push:
    paths:
      - "inputs/inputs.json"
      - "src/voicecaster/**"
      - ".github/workflows/diarization.yml"
      - "pyproject.toml"
      - "requirements*.txt"

permissions:
  contents: write

concurrency:
  group: voicecaster-diarization
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.precheck.outputs.should_run }}
      episode_id: ${{ steps.precheck.outputs.episode_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run diarization precheck
        id: precheck
        shell: bash
        run: |
          set -euo pipefail

          output="$(python -m voicecaster.diarization.precheck)"
          echo "$output"

          should_run="$(echo "$output" | awk -F= '/^should_run=/{print $2}' | tail -n1)"
          episode_id="$(echo "$output" | awk -F= '/^episode_id=/{print $2}' | tail -n1)"

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "episode_id=${episode_id}" >> "$GITHUB_OUTPUT"

  diarization:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and diarization dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyannote.audio torch torchaudio
          pip install -e .

      - name: Show target episode
        run: echo "Running diarization for episode ${{ needs.precheck.outputs.episode_id }}"

      - name: Run diarization
        shell: bash
        run: |
          set -euo pipefail
          python -m voicecaster.diarization.run

      - name: Commit updated state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add inputs/inputs.json work/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "diarization: update work state"
          git push
