name: transcription

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/transcription.yml"
      - "inputs/inputs.json"
      - "src/voicecaster/transcription/**"
      - "requirements.txt"

#  schedule:
#    - cron: "*/15 * * * *"

concurrency:
  group: voicecaster-transcription
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  precheck:
    name: precheck
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if any episode is pending for transcription
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          inputs_path = Path("inputs/inputs.json")
          github_output = os.environ["GITHUB_OUTPUT"]

          if not inputs_path.exists():
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("should_run=false\n")
              raise SystemExit(0)

          data = json.loads(inputs_path.read_text(encoding="utf-8"))

          should_run = any(
              isinstance(item, dict) and item.get("status") == "transcript"
              for item in data
          )

          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

  transcription:
    name: transcription
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'

    permissions:
      contents: write

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py311-transcription-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-transcription-pip-

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run transcription workflow
        shell: bash
        env:
          VOICECASTER_WORKFLOW: transcription
          PYTHONPATH: src
        run: |
          python -m voicecaster.transcription.run

      - name: Show git status
        if: always()
        shell: bash
        run: |
          git status --short

      - name: Commit and push changes
        if: success()
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add inputs/inputs.json work/
          git commit -m "Run transcription workflow"
          git push
